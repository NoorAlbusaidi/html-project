<DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Search</title>
    </head>

    <body>
        <header>
            <h1>Shop smart with Amazon</h1>
            <form action="search-results.html" method="get">
                <input type="text" name="query" placeholder="Search for products...">
                <button type="submit">Search</button>
            </form>
            <nav>
                <a href="#">Account</a> |
                <a href="#">Orders</a> |
                <a href="#">Cart</a>
            </nav>
        </header>
        <nav aria-label="Breadcrumb">

            <a href="#">Home</a> >

            <a href="#">Electronics</a> >

            <span>Headphones</span>

        </nav>
        <asid>
            <h2>Filters :</h2>
            <h3>Brands</h3>

            <input type="checkbox" id="brand1" name="brand" value="Apple">
            <label for="brand1">Apple</label><br>

            <input type="checkbox" id="brand2" name="brand" value="Sony">
            <label for="brand2">Sony</label><br>

            <input type="checkbox" id="brand3" name="brand" value="Samsung">
            <label for="brand3">Samsung</label><br>

            <h3>Customer Rating</h3>
            <input type="radio" id="rating1" name="rating" value="4stars">
            <label for="rating1">4 stars & up</label><br>
        </asid>

    </body>

    </html>
