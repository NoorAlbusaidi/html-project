<DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Details</title>
    </head>

    <body>
        <header>
        <nav aria-label="Breadcrumb">

            <a href="#">Home</a> >

            <a href="#">Electronics</a> >

            <span>Headphones</span>

        </nav>

        </header>
<section id="gallery">

    <h2>Product Images</h2>

    <!-- Main Image -->
    <img src="headphones.jpg"
         alt="Wireless Bluetooth Headphones"
         width="350"
         height="350">

    <br><br>

    <!-- Thumbnail Images -->
    <img src="headphone.jpg"
         alt="Front view"
         width="100"
         height="100">

    <img src="headphones-side.jpg"
         alt="Side view"
         width="100 "
         height="100">

    <img src="headphones-folded.jpg"
         alt="Folded view"
         width="100"
         height="100">

    <img src="headphones-case.jpg"
         alt="Headphones with carrying case"
         width="100"
         height="100">

</section>
<section id="price">

    <h2>Price</h2>

    <p>
        <del>$99.99</del>
        <strong>$79.99</strong>
        (20% OFF)
    </p>

</section>
<section id="variants">

    <h2>Choose a Color</h2>

    <input type="radio"
           id="black"
           name="color"
           value="Black">

    <label for="black">Black</label>

    <br>

    <input type="radio"
           id="white"
           name="color"
           value="White">

    <label for="white">White</label>

    <br>

    <input type="radio"
           id="blue"
           name="color"
           value="Blue">

    <label for="blue">Blue</label>

</section>
<aside id="buy-box">

    <h2>Purchase</h2>

    <label for="quantity">Quantity:</label>

    <select id="quantity" name="quantity">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
    </select>

    <br><br>

    <button type="button">Add to Cart</button>

    <button type="button">Buy Now</button>

    <p><strong>In Stock</strong></p>

    <p>
        Estimated Delivery:
        <time datetime="2026-08-08">
            August 8, 2026
        </time>
    </p>

</aside>
    </body>

    </html>
