<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory Utility</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">
                Product Inventory Utility
            </span>
        </div>
    </nav>


    <main class="container py-4">

        <!-- Computed Summary -->
        <section class="mb-4">

            <h2>Inventory Summary</h2>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>Total Inventory Value</h5>

                            <p id="totalValue" class="fs-4 mb-0"></p>
                        </div>
                    </div>
                </div>


                <div class="col-md-6 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5>Low Stock Products</h5>

                            <p id="lowStockCount" class="fs-4 mb-0"></p>
                        </div>
                    </div>
                </div>

            </div>

        </section>


        <!-- Toggle Button -->
        <button id="toggleButton" class="btn btn-primary mb-4">
            Show Low Stock Only
        </button>


        <!-- Product Cards -->
        <section>

            <h2>Products</h2>

            <div id="productList" class="row"></div>

        </section>

    </main>


    <script src="inventory.js"></script>

</body>

</html>
